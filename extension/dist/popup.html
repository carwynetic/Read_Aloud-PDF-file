<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VieNeu Read Aloud</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="popup-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10v4" />
            <path d="M8 7v10" />
            <path d="M12 4v16" />
            <path d="M16 7v10" />
            <path d="M20 10v4" />
          </svg>
        </span>
        <div>
          <h1 class="brand-title">VieNeu Read Aloud</h1>
          <p class="brand-sub">Dịch & đọc PDF tiếng Việt 48kHz</p>
        </div>
      </div>
      <span id="serverStatus" class="status-pill status-checking" title="Trạng thái máy chủ VieNeu-TTS local">
        <span class="status-dot"></span>
        <span class="status-text">Đang kiểm tra…</span>
      </span>
    </header>

    <section class="actions">
      <button id="openCurrentTabBtn" class="btn btn-primary" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <polygon points="10 12 16 15.5 10 19 10 12" />
        </svg>
        <span id="openCurrentLabel">Đọc PDF ở tab hiện tại</span>
      </button>

      <button id="openBlankReaderBtn" class="btn btn-secondary" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <span>Mở file PDF từ máy tính / dán link</span>
      </button>
    </section>

    <section class="setting-row">
      <label class="toggle-label" for="autoInterceptToggle">
        <div>
          <span class="setting-title">Tự động mở link PDF</span>
          <span class="setting-desc">Chuyển thẳng các link .pdf và arXiv vào VieNeu Reader</span>
        </div>
        <input id="autoInterceptToggle" type="checkbox" class="switch" />
      </label>
    </section>

    <footer id="offlineHint" class="offline-hint" hidden>
      Chưa thấy server ở <code>127.0.0.1:8765</code>. Chạy file <code>start-vieneu-readaloud.bat</code> để bật VieNeu-TTS.
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
